name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      # Examples, e2e and type-aware lint read the adapter's types from dist/
      - run: pnpm build
      - run: pnpm test:format
      - run: pnpm test:lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm size
      # Fails on a link to a page that doesn't exist
      - run: pnpm docs:build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A range, so this picks up the stable Hono 5 when it ships
        hono: [catalog, '^5.0.0-rc.1']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The adapter and the examples share the catalog's hono, so changing it
      # there keeps one Hono in each bundle
      - name: Use the Hono version under test
        if: matrix.hono != 'catalog'
        run: |
          sed -i "s/^  hono: .*/  hono: ${{ matrix.hono }}/" pnpm-workspace.yaml

      - run: pnpm install ${{ matrix.hono == 'catalog' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
